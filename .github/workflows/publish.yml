name: Publish to npm
on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-and-deps
      - name: Check release validity
        run: sh .github/scripts/check-release.sh
      - name: Check tag format
        run: sh .github/scripts/check-tag-format.sh "${{ github.event.release.prerelease }}"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
      # The plugin's engines field is Node 20, and yarn refuses to install
      # outside that range, so the build stays on .nvmrc. Node 22 still ships
      # npm 10, which sends setup-node's placeholder NODE_AUTH_TOKEN and never
      # exchanges the GitHub OIDC identity. The registry then answers 404.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11
      - name: Publish with latest tag
        if: "!github.event.release.prerelease && !contains(github.ref, 'beta')"
        run: npm publish . --access public --provenance
      - name: Publish with beta tag
        if: "github.event.release.prerelease && contains(github.ref, 'beta')"
        run: npm publish . --access public --provenance --tag beta
