name: Publish to npm
on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-and-deps
      - name: Check release validity
        run: sh .github/scripts/check-release.sh
      - name: Check tag format
        run: sh .github/scripts/check-tag-format.sh "${{ github.event.release.prerelease }}"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      # Node 20 ships npm 10. actions/setup-node writes a placeholder
      # NODE_AUTH_TOKEN, and npm 10 sends that token instead of exchanging
      # the GitHub OIDC identity. The registry then answers 404. npm 11
      # replaces the placeholder with a trusted-publisher token.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11
      - name: Publish with latest tag
        if: "!github.event.release.prerelease && !contains(github.ref, 'beta')"
        run: npm publish . --access public --provenance
      - name: Publish with beta tag
        if: "github.event.release.prerelease && contains(github.ref, 'beta')"
        run: npm publish . --access public --provenance --tag beta
